  <body data-page="dashboards">
    <template id="content">
      <div class="doc-page-head"><p class="eyebrow">Applications</p><h1>Dashboards</h1><p class="lead">Six domain dashboards share Orzen’s header, sidebar, footer, theme controls, and reusable UI. Each feature keeps its own widgets and demo data.</p></div>
      <section class="doc-section" aria-labelledby="overview"><h2 id="overview">Choose a dashboard</h2><p>Open a route to see the finished interface, then inspect its feature folder to adapt the data and interactions.</p><div class="doc-grid"><div class="doc-panel"><i class="ri-dashboard-line" aria-hidden="true"></i><h3>Sales</h3><p>Revenue comparisons, overview metrics, product insights, sales team performance, and recent invoices.</p><small><code>/dashboards/sales</code></small></div><div class="doc-panel"><i class="ri-git-branch-line" aria-hidden="true"></i><h3>CRM</h3><p>Pipeline stages, conversion, follow-ups, account coverage, and opportunity risk.</p><small><code>/dashboards/crm</code></small></div><div class="doc-panel"><i class="ri-apps-2-line" aria-hidden="true"></i><h3>eCommerce</h3><p>Products, revenue, orders, fulfillment, inventory, and customer behavior.</p><small><code>/dashboards/ecommerce</code></small></div><div class="doc-panel"><i class="ri-layout-grid-line" aria-hidden="true"></i><h3>SaaS</h3><p>Subscriptions, revenue movement, retention, plan performance, and billing operations.</p><small><code>/dashboards/saas</code></small></div><div class="doc-panel"><i class="ri-folder-open-line" aria-hidden="true"></i><h3>HR</h3><p>Workforce, attendance, departments, leave approvals, and recruitment activity.</p><small><code>/dashboards/hr</code></small></div><div class="doc-panel"><i class="ri-code-s-slash-line" aria-hidden="true"></i><h3>AI</h3><p>Operations, token costs, model performance, request activity, and guardrails.</p><small><code>/dashboards/ai</code></small></div></div></section>
      <section class="doc-section" aria-labelledby="architecture"><h2 id="architecture">How they are organized</h2><p>Route files live under <code>src/app/(admin)/dashboards/</code>. Matching folders under <code>src/features/dashboards/</code> hold page components, data, and widget code.</p><pre data-lang="text"><code>src/app/(admin)/dashboards/sales/page.tsx
src/features/dashboards/sales/sales-dashboard.tsx
src/features/dashboards/sales/data.ts</code></pre><div class="doc-callout"><i class="ri-information-line" aria-hidden="true"></i><div><strong>Shared shell</strong><p>Admin dashboards render inside <code>AppShell</code>. Adjust the shared header or sidebar once instead of duplicating it in each feature.</p></div></div></section>
      <section class="doc-section" aria-labelledby="adapting"><h2 id="adapting">Adapt a dashboard</h2><ul class="doc-list"><li><i class="ri-check-line" aria-hidden="true"></i><div><strong>Review demo data</strong><span>Start with the feature’s data or seed files and identify the metrics your API will supply.</span></div></li><li><i class="ri-check-line" aria-hidden="true"></i><div><strong>Keep widget contracts stable</strong><span>Reuse shared cards, buttons, table controls, and chart tooltips.</span></div></li><li><i class="ri-check-line" aria-hidden="true"></i><div><strong>Check both themes</strong><span>Verify labels, chart series, tooltips, and empty states in light and dark appearance.</span></div></li></ul></section>
    </template>
