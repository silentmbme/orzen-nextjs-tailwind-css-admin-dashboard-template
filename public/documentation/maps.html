  <body data-page="maps">
    <template id="content">
      <div class="doc-page-head"><p class="eyebrow">Maps</p><h1>Map integrations</h1><p class="lead">Orzen includes three map approaches. Choose one based on whether you need bundled geography, Google services, or a configurable tile provider.</p></div>
      <section class="doc-section" aria-labelledby="vector"><h2 id="vector">Vector maps</h2><p><code>/maps/vector</code> uses D3 geography with a bundled country dataset. It works without a map API key and is suited to region-focused visualizations.</p><div class="doc-grid"><div class="doc-panel"><i class="ri-map-2-line" aria-hidden="true"></i><h3>Implementation</h3><p><code>src/features/maps/vector/vector-maps-page.tsx</code> renders the interactive examples.</p></div><div class="doc-panel"><i class="ri-folder-open-line" aria-hidden="true"></i><h3>Geographic data</h3><p><code>countries-110m.json</code> is bundled beside the feature. Review <code>DATA-LICENSE.txt</code> before redistributing it.</p></div></div></section>
      <section class="doc-section" aria-labelledby="google"><h2 id="google">Google Maps</h2><p><code>/maps/google</code> loads the Google Maps JavaScript API in the browser. Configure an API key and add a Map ID for features that need advanced markers or route endpoints.</p><pre data-lang="environment"><code>NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=your_browser_key
NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=your_map_id</code></pre><ul class="doc-list"><li><i class="ri-check-line" aria-hidden="true"></i><div><strong>Enable the required APIs</strong><span>Configure billing and the Maps APIs used by your Google Cloud project.</span></div></li><li><i class="ri-check-line" aria-hidden="true"></i><div><strong>Restrict the browser key</strong><span>Allow your development and production website origins in Google Cloud.</span></div></li><li><i class="ri-check-line" aria-hidden="true"></i><div><strong>Restart after changing environment values</strong><span>Next.js reads public environment variables during development and build startup.</span></div></li></ul><div class="doc-callout"><i class="ri-information-line" aria-hidden="true"></i><div><strong>Missing credentials</strong><p>The page shows setup guidance when the key is absent. Keep private server credentials out of <code>NEXT_PUBLIC_</code> variables.</p></div></div></section>
      <section class="doc-section" aria-labelledby="leaflet"><h2 id="leaflet">Leaflet maps</h2><p><code>/maps/leaflet</code> uses React Leaflet. The tile URL, display name, and attribution are configurable; the default tiles use OpenStreetMap.</p><pre data-lang="environment"><code>NEXT_PUBLIC_LEAFLET_TILE_URL=https://tile.openstreetmap.org/{z}/{x}/{y}.png
NEXT_PUBLIC_LEAFLET_TILE_NAME=OpenStreetMap
NEXT_PUBLIC_LEAFLET_TILE_ATTRIBUTION=Map data attribution</code></pre><p>Keep attribution visible and review your tile provider’s usage policy before production traffic. The map tiles retain their provider style when the admin theme changes.</p></section>
    </template>
