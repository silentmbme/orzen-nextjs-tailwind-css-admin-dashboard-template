      <div class="doc-page-head"><p class="eyebrow">Components</p><h1>Shared building blocks</h1><p class="lead">Orzen keeps controls and data presentation in reusable components. Start with these primitives, then compose feature-specific views around them.</p></div>
      <section class="doc-section" aria-labelledby="ui"><h2 id="ui">UI components</h2><p>Shared UI lives in <code>src/components/ui/</code>. The showcase routes under <code>/ui/</code> demonstrate visual states and interactions.</p><div class="doc-grid"><div class="doc-panel"><i class="ri-layout-grid-line" aria-hidden="true"></i><h3>Cards and feedback</h3><p><code>Card</code>, <code>Badge</code>, dialogs, empty states, and alerts provide consistent surfaces and messaging.</p><small>Examples: <code>/ui/cards</code>, <code>/ui/badges</code>, <code>/ui/modals</code></small></div><div class="doc-panel"><i class="ri-settings-3-line" aria-hidden="true"></i><h3>Controls</h3><p><code>Button</code>, <code>Input</code>, <code>Select</code>, and field components share sizing and focus behavior.</p><small>Examples: <code>/ui/buttons</code>, <code>/forms/elements</code></small></div></div><pre data-lang="tsx"><code>import { Button } from "@/components/ui/button";
import { Card } from "@/components/ui/card";

export function WelcomeCard() {
  return &lt;Card title="Overview"&gt;&lt;Button variant="primary"&gt;Continue&lt;/Button&gt;&lt;/Card&gt;;
}</code></pre></section>
      <section class="doc-section" aria-labelledby="charts"><h2 id="charts">Charts</h2><p>The chart showcases use Recharts and cover multiple shapes and interaction styles. Chart examples live under <code>src/features/charts/</code>; dashboard widgets reuse shared chart containers and tooltips where appropriate.</p><div class="doc-tag-row"><span>Line</span><span>Area</span><span>Bar</span><span>Pie &amp; donut</span><span>Radar</span><span>Radial</span><span>Scatter</span><span>Bubble</span><span>Heatmap</span></div><div class="doc-callout"><i class="ri-palette-line" aria-hidden="true"></i><div><strong>Theme-aware charts</strong><p>Use the existing chart CSS variables for colors and check grid, tooltip, and label contrast in both themes.</p></div></div></section>
      <section class="doc-section" aria-labelledby="forms"><h2 id="forms">Forms</h2><p>Form showcases demonstrate fields, layouts, validation, multi-step flows, uploads, and a rich text editor.</p><div class="doc-table-wrap"><table class="doc-table"><thead><tr><th>Route</th><th>What to review</th></tr></thead><tbody><tr><td><code>/forms/elements</code></td><td>Inputs, selections, and advanced controls.</td></tr><tr><td><code>/forms/layouts</code></td><td>Basic and business form compositions.</td></tr><tr><td><code>/forms/validation</code></td><td>Errors, valid states, and field feedback.</td></tr><tr><td><code>/forms/wizard</code></td><td>Guided multi-step forms.</td></tr><tr><td><code>/forms/file-upload</code></td><td>Dropzones, images, and upload status.</td></tr><tr><td><code>/forms/editor</code></td><td>Rich text editing and toolbar controls.</td></tr></tbody></table></div></section>
      <section class="doc-section" aria-labelledby="tables"><h2 id="tables">Tables</h2><p><code>src/components/ui/data-table.tsx</code> supplies shared table behavior. The showcase pages cover standard, expandable, and editable patterns.</p><ul class="doc-list"><li><i class="ri-check-line" aria-hidden="true"></i><div><strong>Basic tables</strong><span>Compare compact layouts and business data formatting at <code>/tables/basic</code>.</span></div></li><li><i class="ri-check-line" aria-hidden="true"></i><div><strong>Expandable tables</strong><span>See order details, nested project rows, and employee profiles at <code>/tables/expandable</code>.</span></div></li><li><i class="ri-check-line" aria-hidden="true"></i><div><strong>Editable tables</strong><span>Review inline, row, and spreadsheet-style editing at <code>/tables/editable</code>.</span></div></li></ul></section>
